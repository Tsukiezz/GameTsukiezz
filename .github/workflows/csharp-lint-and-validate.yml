name: C# & Assets Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate:
    name: Code & Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify Unity Manifest & Project Settings
        run: |
          echo "Checking Packages/manifest.json..."
          test -f Packages/manifest.json || { echo "Packages/manifest.json is missing!"; exit 1; }
          echo "Checking ProjectSettings/ProjectVersion.txt..."
          test -f ProjectSettings/ProjectVersion.txt || { echo "ProjectSettings/ProjectVersion.txt is missing!"; exit 1; }
          echo "Unity project structure validated."

      - name: Scan C# Scripts for Syntax Errors
        run: |
          echo "Scanning C# files in Assets/Scripts/..."
          find Assets/Scripts -name "*.cs" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
          done
          echo "All C# scripts checked."

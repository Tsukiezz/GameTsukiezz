name: Release Draft

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  draft_release:
    name: Create Release Draft
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
